<!DOCTYPE html>
<html>
<head>
<title>Dynamic To Do List</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(120deg,#e9d5ff,#c084fc);
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    background: white;
    width: 500px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #888;
}

h1 {
    text-align: center;
    color: blue;
}

.input-box {
    display: flex;
    gap: 10px;
}

input {
    padding: 12px;
    width: 70%;
    border: 2px solid #b56cff;
    border-radius: 8px;
    outline: none;
}

button {
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #a855f7;
    transform: scale(1.05);
}

ul {
    padding: 0;
}

li {
    list-style: none;
    background: #f3e8ff;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fade 0.4s;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.completed {
    text-decoration: line-through;
    color: gray;
}

.delete {
    background: blue;
}

.edit {
    background: #7c3aed;
}
</style>
</head>

<body>

<div class="container">

<h1> To Do List </h1>

<div class="input-box">
    <input type="text" id="task" placeholder="Enter your task">
    <button onclick="addTask()">Add</button>
</div>

<h2>My Tasks</h2>

<ul id="taskList"></ul>

<p id="count">Total Tasks: 0</p>

<button onclick="clearAll()">Clear All</button>

</div>

<script>

function addTask()
{
    let input = document.getElementById("task");
    let value = input.value.trim();

    if(value == "")
    {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");

    let span = document.createElement("span");
    span.textContent = value;

    span.onclick = function()
    {
        span.classList.toggle("completed");
        updateCount();
    };

    let edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "edit";

    edit.onclick = function()
    {
        let newTask = prompt("Edit your task", span.textContent);

        if(newTask != null && newTask.trim() != "")
        {
            span.textContent = newTask.trim();
        }
    };

    let del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "delete";

    del.onclick = function()
    {
        li.remove();
        updateCount();
    };

    li.appendChild(span);
    li.appendChild(edit);
    li.appendChild(del);

    document.getElementById("taskList").appendChild(li);

    input.value = "";

    updateCount();
}

function updateCount()
{
    let total = document.querySelectorAll("#taskList li").length;

    let completed = document.querySelectorAll(
        "#taskList .completed"
    ).length;

    document.getElementById("count").textContent =
        "Total Tasks: " + total +
        " | Completed: " + completed;
}

function clearAll()
{
    document.getElementById("taskList").innerHTML = "";
    updateCount();
}

</script>

</body>
</html>
